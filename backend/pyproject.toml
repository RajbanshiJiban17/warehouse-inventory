[project]
name = "inventory-management-system"
version = "0.1.0"
description = "Inventory & Warehouse Management System (FastAPI + React/Electron)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "sqlalchemy>=2.0.38",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "slowapi>=0.1.9",
    "structlog>=25.1.0",
    "openpyxl>=3.1.5",
    "reportlab>=4.3.0",
    "python-multipart>=0.0.20",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
