services:
  # FastAPI Backend Web Service
  - type: web
    name: goodwan-inventory-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m alembic upgrade head && python -m app.scripts.seed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: postgresql://retailiq_admin:2uCfju1XvxVlBUyi20tcxd83n3SuE3xn@dpg-dam3cme7bikc73862pk0-a/retailiq_nepal?options=-csearch_path%3Dinventory,public
      - key: SECRET_KEY
        generateValue: true
      - key: REFRESH_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: rajbanshijiban288@gmail.com
      - key: ADMIN_INITIAL_PASSWORD
        value: Admin@12345
      - key: CORS_ORIGINS
        value: https://goodwan-inventory-frontend.onrender.com,http://localhost:5173

  # React Frontend Static Site
  - type: web
    name: goodwan-inventory-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://goodwan-inventory-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
