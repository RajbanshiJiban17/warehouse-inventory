services:
  # FastAPI Backend Web Service
  - type: web
    name: goodwan-inventory-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m alembic upgrade head && python -m app.scripts.seed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: goodwan-inventory-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: REFRESH_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: rajbanshijiban288@gmail.com
      - key: ADMIN_INITIAL_PASSWORD
        value: Admin@12345
      - key: CORS_ORIGINS
        value: https://goodwan-inventory-frontend.onrender.com,http://localhost:5173

  # React Frontend Static Site
  - type: static
    name: goodwan-inventory-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://goodwan-inventory-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Free PostgreSQL Database
  - name: goodwan-inventory-db
    region: oregon
    plan: free
    databaseName: inventory_db
    user: inventory_user
